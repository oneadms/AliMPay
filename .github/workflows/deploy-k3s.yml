name: Deploy to K3s

on:
  push:
    branches:
      - dev
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/alimpay
      IMAGE_TAG: ${{ github.sha }}
      K8S_NAMESPACE: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker Build And Push
        run: |
          docker build --platform=linux/amd64 -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to K3s
        env:
          ALIPAY_CONFIG_PHP: ${{ secrets.ALIPAY_CONFIG_PHP }}
        run: |
          kubectl config set-cluster k3s --server=${{ secrets.K3S_SERVER }} --insecure-skip-tls-verify=true
          kubectl config set-credentials k3s --token=${{ secrets.K3S_TOKEN }}
          kubectl config set-context k3s --cluster=k3s --user=k3s --namespace=$K8S_NAMESPACE
          kubectl config use-context k3s
          kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
          printf '%s' "$ALIPAY_CONFIG_PHP" > alipay.php
          kubectl create secret generic alimpay-config \
            --from-file=alipay.php=alipay.php \
            -n $K8S_NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret docker-registry dockerhub-registry \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKER_USERNAME }} \
            --docker-password=${{ secrets.DOCKER_PASSWORD }} \
            -n $K8S_NAMESPACE \
            --dry-run=client -o yaml | kubectl apply -f -
          sed -i "s|image: __IMAGE__|image: $IMAGE_NAME:$IMAGE_TAG|" ./Kubernetes-dev.yaml
          sed -i "s|host: __ALIMPAY_HOST__|host: ${{ secrets.ALIMPAY_HOST }}|" ./Kubernetes-dev.yaml
          kubectl apply -n $K8S_NAMESPACE -f ./Kubernetes-dev.yaml
          kubectl rollout restart -n $K8S_NAMESPACE deployment/alimpay
          kubectl rollout status -n $K8S_NAMESPACE deployment/alimpay --timeout=180s
