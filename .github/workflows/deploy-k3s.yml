name: Deploy to K3s

on:
  push:
    branches:
      - dev
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_NAME: alimpay
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_ARCHIVE: alimpay-${{ github.sha }}.tar
      K8S_NAMESPACE: dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Build And Save
        run: |
          docker build --platform=linux/amd64 -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
          docker save -o $IMAGE_ARCHIVE $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest

      - name: Import image on K3s node
        env:
          K3S_SSH_HOST: ${{ secrets.K3S_SSH_HOST }}
          K3S_SSH_PORT: ${{ secrets.K3S_SSH_PORT || '22' }}
          K3S_SSH_USER: ${{ secrets.K3S_SSH_USER }}
          K3S_SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          test -n "$K3S_SSH_HOST"
          test -n "$K3S_SSH_PORT"
          test -n "$K3S_SSH_USER"
          test -n "$K3S_SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s' "$K3S_SSH_KEY" > ~/.ssh/k3s_key
          chmod 600 ~/.ssh/k3s_key
          ssh-keyscan -p "$K3S_SSH_PORT" "$K3S_SSH_HOST" >> ~/.ssh/known_hosts
          scp -P "$K3S_SSH_PORT" -i ~/.ssh/k3s_key "$IMAGE_ARCHIVE" "$K3S_SSH_USER@$K3S_SSH_HOST:/tmp/$IMAGE_ARCHIVE"
          ssh -p "$K3S_SSH_PORT" -i ~/.ssh/k3s_key "$K3S_SSH_USER@$K3S_SSH_HOST" "sudo k3s ctr -n k8s.io images import /tmp/$IMAGE_ARCHIVE && rm -f /tmp/$IMAGE_ARCHIVE"

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy to K3s
        env:
          ALIPAY_CONFIG_PHP: ${{ secrets.ALIPAY_CONFIG_PHP }}
          ALIMPAY_HOST: ${{ secrets.ALIMPAY_HOST }}
        run: |
          test -n "$ALIPAY_CONFIG_PHP"
          test -n "$ALIMPAY_HOST"
          kubectl config set-cluster k3s --server=${{ secrets.K3S_SERVER }} --insecure-skip-tls-verify=true
          kubectl config set-credentials k3s --token=${{ secrets.K3S_TOKEN }}
          kubectl config set-context k3s --cluster=k3s --user=k3s --namespace=$K8S_NAMESPACE
          kubectl config use-context k3s
          kubectl create namespace $K8S_NAMESPACE --dry-run=client -o yaml | kubectl apply --validate=false -f -
          printf '%s' "$ALIPAY_CONFIG_PHP" > alipay.php
          kubectl create secret generic alimpay-config \
            --from-file=alipay.php=alipay.php \
            -n $K8S_NAMESPACE \
            --dry-run=client -o yaml | kubectl apply --validate=false -f -
          sed -i "s|image: __IMAGE__|image: $IMAGE_NAME:$IMAGE_TAG|" ./Kubernetes-dev.yaml
          sed -i "s|__ALIMPAY_HOST__|$ALIMPAY_HOST|g" ./Kubernetes-dev.yaml
          kubectl apply --validate=false -n $K8S_NAMESPACE -f ./Kubernetes-dev.yaml
          kubectl rollout status -n $K8S_NAMESPACE deployment/alimpay --timeout=300s
